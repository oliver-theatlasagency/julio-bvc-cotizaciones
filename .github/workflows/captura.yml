name: Captura diaria BVC
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Prueba corta de 15 segundos'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bvc-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capturar cinta pública
        run: node capture.mjs
        env:
          CAPTURE_SECONDS: ${{ inputs.test && '15' || '300' }}
      - name: Guardar captura
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cotizaciones.json
          git diff --cached --quiet || (git commit -m 'Actualizar captura de cotizaciones BVC' && git push)

